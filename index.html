<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Winter Cabin</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0b1020; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
  #scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; }

  /* White fade-in on load + soft flash on photo-set switch */
  #fade { position: fixed; inset: 0; background: #ffffff; opacity: 1; pointer-events: none;
          transition: opacity 2s ease; z-index: 30; }
  #fade.gone { opacity: 0; }
  #fade.switching { transition: opacity .3s ease; opacity: .92; }

  /* Glass control panel — desktop: compact, top-right, closable */
  .glass-panel {
    position: fixed; right: 20px; top: 20px; bottom: auto; left: auto; width: 150px; z-index: 20;
    background: linear-gradient(160deg, rgba(255,255,255,.10), rgba(255,255,255,.05));
    border: 1px solid rgba(255,255,255,.14);
    border-radius: 14px;
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px); /* Safari — required */
    box-shadow: 0 14px 38px -16px rgba(0,0,0,.75);
    padding: 10px 10px 8px;
    color: #eef3fb;
    user-select: none;
  }
  .glass-panel h1 { margin: 0 0 7px; font-size: 11px; font-weight: 600; letter-spacing: .03em; padding-right: 18px; }
  .glass-panel h1 span { opacity: .55; font-weight: 400; font-size: 8.5px; margin-left: 4px; }
  .glass-panel.closed { display: none; }

  /* close ✕ in the panel's top-right corner */
  #closeBtn {
    position: absolute; top: 7px; right: 7px; width: 18px; height: 18px;
    border-radius: 6px; border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.08); color: #eef3fb; cursor: pointer;
    font: 600 10px/16px inherit; font-family: inherit; padding: 0;
    transition: background .2s;
  }
  #closeBtn:hover { background: rgba(255,255,255,.18); }

  /* reopen button, top-right corner of the screen */
  #openBtn {
    position: fixed; top: 20px; right: 20px; z-index: 19;
    width: 34px; height: 34px; border-radius: 11px; cursor: pointer;
    background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.06));
    border: 1px solid rgba(255,255,255,.18); color: #eef3fb;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 10px 26px -12px rgba(0,0,0,.7);
    font-size: 15px; line-height: 32px; padding: 0; font-family: inherit;
    display: none;
  }
  #openBtn:hover { background: rgba(255,255,255,.20); }
  #openBtn.show { display: block; }

  /* photo-series picker: 2 x 2 table */
  .series-table { display: grid; grid-template-columns: 1fr 1fr; gap: 3px; }
  .ctl { margin-bottom: 8px; }
  .ctl label { display: flex; justify-content: space-between; align-items: center; gap: 4px;
               font-size: 9px; opacity: .85; margin-bottom: 3px; letter-spacing: .02em; }
  .ctl input[type="range"] { width: 100%; accent-color: #ffb45c; height: 14px; margin: 0; cursor: pointer; }
  .seg { display: flex; gap: 3px; }
  .seg.stack { margin-top: 4px; }
  .seg button, .series-table button {
    flex: 1; min-width: 0; font-size: 8px; padding: 4px 1px; border-radius: 7px; cursor: pointer;
    color: #eef3fb; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.14);
    transition: background .2s, border-color .2s;
    font-family: inherit;
  }
  .seg button:hover, .series-table button:hover { background: rgba(255,255,255,.16); }
  .seg button.on, .series-table button.on { background: rgba(255,180,92,.30); border-color: rgba(255,180,92,.55); }
  .toggle { display: flex; align-items: center; gap: 4px; font-size: 8.5px; cursor: pointer; opacity: .9; }
  .toggle input { accent-color: #ffb45c; margin: 0; cursor: pointer; width: 11px; height: 11px; }
  #phaseLabel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hint { font-size: 8px; opacity: .55; margin: 7px 0 0; line-height: 1.4; }
  #handle { display: none; }

  /* Language picker — a real 4-cell table with shared grid lines */
  .lang-table {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border: 1px solid rgba(255,255,255,.16); border-radius: 7px; overflow: hidden;
  }
  .lang-table button {
    font-size: 8.5px; font-weight: 600; letter-spacing: .05em; padding: 5px 0;
    color: #eef3fb; background: rgba(255,255,255,.06); border: 0;
    border-left: 1px solid rgba(255,255,255,.16);
    cursor: pointer; font-family: inherit; transition: background .2s;
  }
  .lang-table button:first-child { border-left: 0; }
  .lang-table button:hover { background: rgba(255,255,255,.16); }
  .lang-table button.on { background: rgba(255,180,92,.30); color: #fff; }

  /* Mobile: bottom drawer, lighter blur, everything 5px from both screen edges */
  @media (max-width: 700px) {
    .glass-panel {
      left: 0; right: 0; bottom: 0; top: auto; width: auto;
      border-radius: 18px 18px 0 0;
      border-left: none; border-right: none; border-bottom: none;
      backdrop-filter: blur(11px);
      -webkit-backdrop-filter: blur(11px);
      box-shadow: 0 -12px 32px -14px rgba(0,0,0,.7);
      padding: 0 5px 10px;
      transform: translateY(calc(100% - 42px));
      transition: transform .35s cubic-bezier(.4, 0, .2, 1);
      max-height: 72vh;
    }
    .glass-panel.open { transform: none; overflow-y: auto; }
    /* the drawer has its own handle — the desktop open/close pair is hidden */
    .glass-panel.closed { display: block; }
    #closeBtn, #openBtn { display: none !important; }
    #handle {
      display: block; width: 100%; background: none; border: none; color: #eef3fb;
      font: 600 13px/42px inherit; letter-spacing: .04em; cursor: pointer; padding: 0;
      font-family: inherit;
    }
    #handle::after { content: " ▴"; opacity: .6; }
    .glass-panel.open #handle::after { content: " ▾"; }
    .glass-panel h1 { display: none; }
    /* full-size, thumb-friendly controls on touch screens */
    .ctl { margin-bottom: 10px; }
    .ctl label { font-size: 11.5px; margin-bottom: 4px; }
    .ctl input[type="range"] { height: 20px; }
    .seg { gap: 4px; }
    .series-table { gap: 4px; }
    .seg button, .series-table button { font-size: 10.5px; padding: 7px 2px; border-radius: 9px; }
    .toggle { font-size: 11px; gap: 5px; }
    .toggle input { width: 14px; height: 14px; }
    .hint { font-size: 10px; margin: 8px 0 0; }
    .lang-table { border-radius: 9px; }
    .lang-table button { font-size: 11.5px; padding: 9px 0; letter-spacing: .06em; }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<button id="openBtn" aria-label="Vezérlők">⚙</button>

<div class="glass-panel" id="panel">
  <button id="handle">Winter Cabin</button>
  <button id="closeBtn" aria-label="Bezárás">✕</button>
  <h1>Winter Cabin <span data-t="controls">vezérlők</span></h1>

  <div class="ctl">
    <label><span data-t="language">Nyelv</span></label>
    <div class="lang-table" id="langSeg">
      <button data-l="hu" class="on">HU</button>
      <button data-l="en">EN</button>
      <button data-l="ro">RO</button>
      <button data-l="de">DE</button>
    </div>
  </div>

  <div class="ctl">
    <label><span data-t="series">Fotósorozat</span></label>
    <div class="series-table" id="setSeg">
      <button data-s="0" class="on" data-t="series1">Séria 1</button>
      <button data-s="1" data-t="series2">Séria 2</button>
      <button data-s="2" data-t="series3">Séria 3</button>
      <button data-s="3" data-t="series4">Séria 4</button>
    </div>
  </div>

  <div class="ctl">
    <label for="snowRange"><span data-t="snow">Hóesés</span><span id="snowLabel">Kitartó</span></label>
    <input type="range" id="snowRange" min="0" max="1" step="0.01" value="0.5">
  </div>

  <div class="ctl">
    <label for="timeRange"><span data-t="time">Napszak</span>
      <span id="phaseLabel" style="opacity:.7">Napkelte</span>
      <span class="toggle"><input type="checkbox" id="autoTime" checked> <span data-t="auto">Auto</span></span>
    </label>
    <input type="range" id="timeRange" min="0" max="1" step="0.001" value="0">
  </div>

  <div class="ctl">
    <label for="speedRange"><span data-t="speed">Sebesség</span><span id="speedLabel">1.0×</span></label>
    <input type="range" id="speedRange" min="0.2" max="4" step="0.1" value="1">
  </div>

  <div class="ctl">
    <label><span data-t="wind">Szél</span></label>
    <div class="seg" id="windSeg">
      <button data-w="calm" data-t="windCalm">Szélcsend</button>
      <button data-w="breezy" class="on" data-t="windBreezy">Szellő</button>
      <button data-w="stormy" data-t="windStormy">Viharos</button>
    </div>
  </div>

  <div class="ctl">
    <label for="volRange"><span data-t="sound">Hang</span>
      <span class="toggle"><input type="checkbox" id="soundOn"> <span data-t="on">Be</span></span>
    </label>
    <input type="range" id="volRange" min="0" max="1" step="0.01" value="0.6">
    <div class="seg stack" id="audSeg">
      <button data-a="wind" class="on" data-t="audWind">Szél</button>
      <button data-a="fire" class="on" data-t="audFire">Tűz</button>
      <button data-a="pad" class="on" data-t="audPad">Háttér</button>
    </div>
  </div>

  <p class="hint" data-t="hint">A napszak csúszka a négy fotó — napkelte, dél, délután, este — között úszik át.</p>
</div>

<div id="fade"></div>

<script>
(function () {
'use strict';

/* ============================== utilities ============================== */

const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, f) => a + (b - a) * f;
const smooth = f => f * f * (3 - 2 * f);

/* ============================== i18n ============================== */

const I18N = {
  hu: {
    _html: 'hu', _handle: 'Vezérlők',
    controls: 'vezérlők', language: 'Nyelv',
    series: 'Fotósorozat', series1: 'Séria 1', series2: 'Séria 2', series3: 'Séria 3', series4: 'Séria 4',
    snow: 'Hóesés', snowLevels: ['Szállingózás', 'Kitartó', 'Sűrű', 'Hóvihar'],
    time: 'Napszak', auto: 'Auto', speed: 'Sebesség',
    phases: ['Napkelte', 'Dél', 'Délután', 'Este'],
    wind: 'Szél', windCalm: 'Szélcsend', windBreezy: 'Szellő', windStormy: 'Viharos',
    sound: 'Hang', on: 'Be',
    audWind: 'Szél', audFire: 'Tűz', audPad: 'Háttér',
    hint: 'A hó lassan felgyűlik a fákon és a talajon. A napszak a négy fotó között úszik át.'
  },
  en: {
    _html: 'en', _handle: 'Controls',
    controls: 'controls', language: 'Language',
    series: 'Photo series', series1: 'Series 1', series2: 'Series 2', series3: 'Series 3', series4: 'Series 4',
    snow: 'Snowfall', snowLevels: ['Light flurry', 'Steady', 'Heavy', 'Snowstorm'],
    time: 'Time of day', auto: 'Auto', speed: 'Speed',
    phases: ['Sunrise', 'Noon', 'Afternoon', 'Evening'],
    wind: 'Wind', windCalm: 'Calm', windBreezy: 'Breezy', windStormy: 'Stormy',
    sound: 'Sound', on: 'On',
    audWind: 'Wind', audFire: 'Fire', audPad: 'Ambience',
    hint: 'Snow slowly settles on the trees and the ground. The day crossfades between the four photos.'
  },
  ro: {
    _html: 'ro', _handle: 'Comenzi',
    controls: 'comenzi', language: 'Limbă',
    series: 'Serie foto', series1: 'Seria 1', series2: 'Seria 2', series3: 'Seria 3', series4: 'Seria 4',
    snow: 'Ninsoare', snowLevels: ['Fulgi rari', 'Constantă', 'Deasă', 'Viscol'],
    time: 'Momentul zilei', auto: 'Auto', speed: 'Viteză',
    phases: ['Răsărit', 'Amiază', 'După-amiază', 'Seară'],
    wind: 'Vânt', windCalm: 'Calm', windBreezy: 'Briză', windStormy: 'Furtunos',
    sound: 'Sunet', on: 'Pornit',
    audWind: 'Vânt', audFire: 'Foc', audPad: 'Ambianță',
    hint: 'Zăpada se așază încet pe copaci și pe sol. Ziua trece lin între cele patru fotografii.'
  },
  de: {
    _html: 'de', _handle: 'Regler',
    controls: 'Regler', language: 'Sprache',
    series: 'Fotoserie', series1: 'Serie 1', series2: 'Serie 2', series3: 'Serie 3', series4: 'Serie 4',
    snow: 'Schneefall', snowLevels: ['Leichtes Rieseln', 'Stetig', 'Dicht', 'Schneesturm'],
    time: 'Tageszeit', auto: 'Auto', speed: 'Tempo',
    phases: ['Sonnenaufgang', 'Mittag', 'Nachmittag', 'Abend'],
    wind: 'Wind', windCalm: 'Windstill', windBreezy: 'Brise', windStormy: 'Stürmisch',
    sound: 'Ton', on: 'An',
    audWind: 'Wind', audFire: 'Feuer', audPad: 'Ambiente',
    hint: 'Der Schnee sammelt sich langsam auf Bäumen und Boden. Die Tageszeit blendet zwischen den vier Fotos über.'
  }
};
let lang = 'hu';
let T = I18N.hu;

/* ============================== photos ============================== */

const SETS = [
  ['img/a-napkelte.jpg', 'img/a-del.jpg', 'img/a-delutan.jpg', 'img/a-este.jpg'],
  ['img/b-napkelte.jpg', 'img/b-del.jpg', 'img/b-delutan.jpg', 'img/b-este.jpg'],
  ['img/c-napkelte.jpg', 'img/c-del.jpg', 'img/c-delutan.jpg', 'img/c-este.jpg'],
  ['img/d-napkelte.jpg', 'img/d-del.jpg', 'img/d-delutan.jpg', 'img/d-este.jpg']
];
let setIdx = 0;
const photos = SETS.map(set => set.map(src => {
  const im = new Image();
  im.src = src;
  return im;
}));
let photosReady = false;
Promise.all(photos.flat().map(im => im.decode ? im.decode().catch(() => {}) : Promise.resolve()))
  .then(() => {
    photosReady = true;
    buildLumGrid();          // the darkness map needs the decoded photo
    needsRender = true;
  });

/* ============================== state ============================== */

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
let W = 0, H = 0, dpr = 1, isMobile = false;
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let simT = 0;
let cycleT = 0;                     // 0 napkelte → 0.25 dél → 0.5 délután → 0.75 este
let autoCycle = true;
const CYCLE_SECONDS = 90;
let cycleSpeed = 1;                 // 0.2× … 4× — a napszak-váltás üteme

let intensity = 0.5;
let windMode = 'breezy';

// wind / gusts
let wind = 0, gustEnv = 0, gustDir = 1, gustAmp = 1;
let gustState = 'idle', gustClock = 0, nextGust = 6;
const WIND_CFG = { calm: { base: 0.02, gust: 0.30 }, breezy: { base: 0.14, gust: 0.62 }, stormy: { base: 0.40, gust: 1.05 } };

/* crossfade weights: hold each photo, blend through the last quarter of its phase */
function photoBlend(u) {
  u = ((u % 1) + 1) % 1;
  const p = u * 4;
  const i = Math.floor(p) % 4, j = (i + 1) % 4;
  const f = p - Math.floor(p);
  const fade = f < 0.72 ? 0 : smooth((f - 0.72) / 0.28);
  return { i, j, fade };
}
/* how "night" the view is — the este photo's weight drives flake glow and the ambience */
function nightAmount(u) {
  const b = photoBlend(u);
  let n = 0;
  if (b.i === 3) n += 1 - b.fade;
  if (b.j === 3) n += b.fade;
  return n;
}

/* ============================== snowflakes (flat typed arrays) ============================== */

const MAXF = 820;
const fx = new Float32Array(MAXF), fy = new Float32Array(MAXF), fs = new Float32Array(MAXF),
      fv = new Float32Array(MAXF), fp = new Float32Array(MAXF), fa = new Float32Array(MAXF),
      fo = new Float32Array(MAXF);
const fl = new Uint8Array(MAXF);
let activeFlakes = 0;

const FLAYER = [
  { s: [1.0, 1.5], v: [16, 30],  amp: [2, 6],   al: [0.35, 0.55], freq: 0.7 },
  { s: [2.0, 3.0], v: [42, 70],  amp: [8, 18],  al: [0.55, 0.80], freq: 0.9 },
  { s: [4.0, 6.0], v: [85, 140], amp: [16, 32], al: [0.50, 0.80], freq: 1.15 }
];
function spawnFlake(i, anywhere) {
  const r = Math.random();
  const L = r < 0.45 ? 0 : (r < 0.80 ? 1 : 2);
  const P = FLAYER[L];
  fl[i] = L;
  fx[i] = Math.random() * (W + 80) - 40;
  fy[i] = anywhere ? Math.random() * H : -10 - Math.random() * 40;
  fs[i] = lerp(P.s[0], P.s[1], Math.random());
  fv[i] = lerp(P.v[0], P.v[1], Math.random());
  fp[i] = Math.random() * Math.PI * 2;
  fa[i] = lerp(P.amp[0], P.amp[1], Math.random());
  fo[i] = lerp(P.al[0], P.al[1], Math.random());
}
function targetFlakeCount() {
  if (reduceMotion) return 0;
  const n = Math.round(140 + intensity * 560);
  return Math.min(MAXF, Math.round(n * (isMobile ? 0.45 : 1)));
}
function setActiveFlakes(n) {
  if (n > activeFlakes) for (let i = activeFlakes; i < n; i++) spawnFlake(i, true);
  activeFlakes = n;
}

/* ============ snow accumulation: ground drift + frost that sticks to the trees ============ */

const HN = 160;
const accumPx = new Float32Array(HN);
let maxAccum = 60, accumSmoothT = 0;

let frostCanvas = null, frostCtx = null, frostCount = 0;
const FROST_MAX = 26000;

/* low-res darkness map of the current photo: dark pixels (pines, logs) catch snow */
const LGW = 120, LGH = 76;
let lumGrid = null, lumPhase = -1;
function buildLumGrid() {
  lumGrid = null;
  try {
    const im = photos[setIdx][photoBlend(cycleT).i];
    if (!im.naturalWidth) return;
    const c = document.createElement('canvas');
    c.width = LGW; c.height = LGH;
    const g = c.getContext('2d', { willReadFrequently: true });
    const sc = Math.max(LGW / im.naturalWidth, LGH / im.naturalHeight);
    const w = im.naturalWidth * sc, h = im.naturalHeight * sc;
    g.drawImage(im, (LGW - w) / 2, (LGH - h) / 2, w, h);
    const d = g.getImageData(0, 0, LGW, LGH).data;
    const out = new Float32Array(LGW * LGH);
    for (let i = 0; i < LGW * LGH; i++) {
      out[i] = 1 - (d[i * 4] * 0.30 + d[i * 4 + 1] * 0.55 + d[i * 4 + 2] * 0.15) / 255;
    }
    lumGrid = out;
  } catch (e) {
    lumGrid = null;   // file:// tainted canvas — the y-band fallback below still works
  }
}
function darknessAt(x, y) {
  if (!lumGrid) {
    const f = clamp((y / H - 0.35) / 0.5, 0, 1);
    return 0.4 * f;
  }
  const gx = clamp((x / W * LGW) | 0, 0, LGW - 1);
  const gy = clamp((y / H * LGH) | 0, 0, LGH - 1);
  return lumGrid[gx + gy * LGW];
}
function accumAt(x) {
  const f = clamp(x / W, 0, 1) * (HN - 1);
  const i = f | 0;
  return lerp(accumPx[i], accumPx[Math.min(i + 1, HN - 1)], f - i);
}
function stampFrost(x, y, s) {
  const r = 1.0 + s * 0.6;
  frostCtx.globalAlpha = 0.55;
  frostCtx.fillStyle = '#f6faff';
  frostCtx.beginPath();
  frostCtx.arc(x, y, r, 0, 6.3);
  frostCtx.fill();
  frostCtx.globalAlpha = 1;
  frostCount++;
}
function resetAccum() {
  accumPx.fill(0);
  frostCount = 0;
  if (frostCtx) frostCtx.clearRect(0, 0, W, H);
}
function drawDrift() {
  if (accumPx[0] < 0.5 && accumPx[HN >> 1] < 0.5 && accumPx[HN - 1] < 0.5) {
    let any = false;
    for (let i = 0; i < HN; i += 6) if (accumPx[i] > 0.5) { any = true; break; }
    if (!any) return;
  }
  ctx.beginPath();
  ctx.moveTo(-10, H + 10);
  ctx.lineTo(-10, H + 2 - accumPx[0]);
  for (let i = 1; i < HN; i++) ctx.lineTo(i / (HN - 1) * W, H + 2 - accumPx[i]);
  ctx.lineTo(W + 10, H + 10);
  ctx.closePath();
  const gr = ctx.createLinearGradient(0, H - maxAccum, 0, H);
  gr.addColorStop(0, 'rgba(250,252,255,0.96)');
  gr.addColorStop(1, 'rgba(203,214,238,0.95)');
  ctx.fillStyle = gr;
  ctx.fill();
  ctx.beginPath();
  for (let i = 0; i < HN; i++) {
    const x = i / (HN - 1) * W, y = H + 2 - accumPx[i];
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 1.6;
  ctx.stroke();
}

/* ============================== soft sprite for the gust veil ============================== */

let softSprite = null;
function makeSoftSprite() {
  const d = 64, c = document.createElement('canvas');
  c.width = d; c.height = d;
  const g = c.getContext('2d');
  const gr = g.createRadialGradient(d / 2, d / 2, 0, d / 2, d / 2, d / 2);
  gr.addColorStop(0, 'rgba(255,255,255,1)');
  gr.addColorStop(0.55, 'rgba(255,255,255,0.5)');
  gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr;
  g.fillRect(0, 0, d, d);
  return c;
}

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  dpr = Math.min(2, window.devicePixelRatio || 1);
  isMobile = W < 700;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  softSprite = makeSoftSprite();
  frostCanvas = document.createElement('canvas');
  frostCanvas.width = W; frostCanvas.height = H;
  frostCtx = frostCanvas.getContext('2d');
  maxAccum = H * 0.09;
  resetAccum();
  buildLumGrid();
  setActiveFlakes(targetFlakeCount());
  needsRender = true;
}

/* ============================== wind & gusts ============================== */

function updateWind(dt) {
  const cfg = WIND_CFG[windMode];
  if (!reduceMotion) {
    gustClock += dt;
    if (gustState === 'idle' && gustClock >= nextGust) {
      gustState = 'rise'; gustClock = 0;
      gustDir = Math.random() < 0.72 ? 1 : -1;
      gustAmp = 0.7 + Math.random() * 0.6;
    } else if (gustState === 'rise') {
      gustEnv = smooth(clamp(gustClock / 1.5, 0, 1));
      if (gustClock >= 1.5) { gustState = 'hold'; gustClock = 0; nextGust = 1.2 + Math.random() * 2.3; }
    } else if (gustState === 'hold') {
      gustEnv = 1;
      if (gustClock >= nextGust) { gustState = 'fall'; gustClock = 0; }
    } else if (gustState === 'fall') {
      gustEnv = 1 - smooth(clamp(gustClock / 3, 0, 1));
      if (gustClock >= 3) { gustState = 'idle'; gustClock = 0; gustEnv = 0; nextGust = 8 + Math.random() * 7; }
    }
  }
  const target = cfg.base + cfg.gust * gustAmp * gustEnv * gustDir;
  wind += (target - wind) * Math.min(1, dt * 3);
}

/* ============================== audio (fully procedural, Web Audio API) ============================== */

const audio = { on: false, vol: 0.6, wind: true, fire: true, pad: true };
let AC = null, AN = null, nextCrackle = 0;

function makeNoiseBuffer(seconds) {
  const len = Math.floor(AC.sampleRate * seconds);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++) {
    const w = Math.random() * 2 - 1;
    last = (last + 0.02 * w) / 1.02;   // pink-ish: white softened toward low end
    d[i] = (w * 0.4 + last * 6) * 0.35;
  }
  return buf;
}
function initAudio() {
  if (AC) { AC.resume(); return; }
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (!Ctx) return;
  AC = new Ctx();
  const noise = makeNoiseBuffer(2.5);
  const master = AC.createGain();
  master.gain.value = 0;
  master.connect(AC.destination);

  // wind: looped noise through a swept band-pass — the classic howl
  const windSrc = AC.createBufferSource();
  windSrc.buffer = noise; windSrc.loop = true;
  const windBp = AC.createBiquadFilter();
  windBp.type = 'bandpass'; windBp.frequency.value = 380; windBp.Q.value = 0.7;
  const windGain = AC.createGain(); windGain.gain.value = 0;
  windSrc.connect(windBp); windBp.connect(windGain); windGain.connect(master);
  windSrc.start();

  // gust hiss: same noise, high-passed, only audible during gusts
  const hissSrc = AC.createBufferSource();
  hissSrc.buffer = noise; hissSrc.loop = true; hissSrc.playbackRate.value = 1.31;
  const hissHp = AC.createBiquadFilter();
  hissHp.type = 'highpass'; hissHp.frequency.value = 1500;
  const hissGain = AC.createGain(); hissGain.gain.value = 0;
  hissSrc.connect(hissHp); hissHp.connect(hissGain); hissGain.connect(master);
  hissSrc.start();

  // fireplace: high-passed noise whose gain snaps up in tiny random crackles
  const fireSrc = AC.createBufferSource();
  fireSrc.buffer = noise; fireSrc.loop = true; fireSrc.playbackRate.value = 0.83;
  const fireHp = AC.createBiquadFilter();
  fireHp.type = 'highpass'; fireHp.frequency.value = 2600;
  const crackleGain = AC.createGain(); crackleGain.gain.value = 0;
  const fireBed = AC.createGain(); fireBed.gain.value = 0;
  fireSrc.connect(fireHp);
  fireHp.connect(crackleGain); crackleGain.connect(master);
  const fireLp = AC.createBiquadFilter();
  fireLp.type = 'lowpass'; fireLp.frequency.value = 900;
  fireSrc.connect(fireLp); fireLp.connect(fireBed); fireBed.connect(master);

  // ambience: a very quiet detuned warm chord that breathes
  const padGain = AC.createGain(); padGain.gain.value = 0;
  padGain.connect(master);
  const padLp = AC.createBiquadFilter();
  padLp.type = 'lowpass'; padLp.frequency.value = 640; padLp.Q.value = 0.4;
  padLp.connect(padGain);
  for (const [freq, det, lvl] of [[110, 0, 0.30], [164.8, 4, 0.20], [220, -5, 0.16], [277.2, 6, 0.10]]) {
    const o = AC.createOscillator();
    o.type = 'triangle'; o.frequency.value = freq; o.detune.value = det;
    const og = AC.createGain(); og.gain.value = lvl;
    o.connect(og); og.connect(padLp);
    o.start();
  }
  const lfo = AC.createOscillator();
  lfo.frequency.value = 0.06;
  const lfoAmt = AC.createGain(); lfoAmt.gain.value = 90;
  lfo.connect(lfoAmt); lfoAmt.connect(padLp.frequency);
  lfo.start();

  fireSrc.start();
  AN = { master, windGain, windBp, hissGain, crackleGain, fireBed, padGain };
}
function updateAudio() {
  if (!AC || !AN) return;
  const t = AC.currentTime;
  const on = audio.on ? 1 : 0;
  AN.master.gain.setTargetAtTime(0.9 * audio.vol * on, t, 0.2);
  const wAbs = Math.abs(wind);
  const night = nightAmount(cycleT);
  if (audio.wind) {
    AN.windGain.gain.setTargetAtTime(0.06 + wAbs * 0.34, t, 0.4);
    AN.windBp.frequency.setTargetAtTime(300 + wAbs * 700 + gustEnv * 260, t, 0.35);
    AN.hissGain.gain.setTargetAtTime(gustEnv * 0.10 + wAbs * 0.05, t, 0.3);
  } else {
    AN.windGain.gain.setTargetAtTime(0, t, 0.2);
    AN.hissGain.gain.setTargetAtTime(0, t, 0.2);
  }
  AN.fireBed.gain.setTargetAtTime(audio.fire ? 0.05 : 0, t, 0.3);
  if (!audio.fire) AN.crackleGain.gain.setTargetAtTime(0, t, 0.1);
  AN.padGain.gain.setTargetAtTime(audio.pad ? 0.05 + night * 0.03 : 0, t, 0.8);
}
function stepAudio() {
  if (!AC || !AN || !audio.on || !audio.fire) return;
  if (simT >= nextCrackle) {
    const t = AC.currentTime;
    const peak = 0.10 + Math.random() * 0.22;
    AN.crackleGain.gain.cancelScheduledValues(t);
    AN.crackleGain.gain.setValueAtTime(AN.crackleGain.gain.value, t);
    AN.crackleGain.gain.linearRampToValueAtTime(peak, t + 0.004 + Math.random() * 0.008);
    AN.crackleGain.gain.exponentialRampToValueAtTime(0.001, t + 0.05 + Math.random() * 0.12);
    nextCrackle = simT + 0.05 + Math.random() * 0.55;
  }
}

/* ============================== drawing ============================== */

/* cover-fit draw, like CSS background-size: cover */
function drawCover(im, alpha) {
  if (!im.naturalWidth) return;
  const sc = Math.max(W / im.naturalWidth, H / im.naturalHeight);
  const w = im.naturalWidth * sc, h = im.naturalHeight * sc;
  ctx.globalAlpha = alpha;
  ctx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
  ctx.globalAlpha = 1;
}

function drawFlakes(night) {
  /* over the dark evening photo the small flakes glow a touch brighter */
  const boost = 1 + night * 0.25;
  ctx.fillStyle = '#ffffff';
  for (let i = 0; i < activeFlakes; i++) {
    const L = fl[i];
    if (L === 2) {
      const r = fs[i];
      const gr = ctx.createRadialGradient(fx[i], fy[i], 0, fx[i], fy[i], r);
      gr.addColorStop(0, `rgba(255,255,255,${fo[i]})`);
      gr.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.arc(fx[i], fy[i], r, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
    } else {
      ctx.globalAlpha = Math.min(1, fo[i] * boost);
      ctx.fillRect(fx[i], fy[i], fs[i], fs[i]);
    }
  }
  ctx.globalAlpha = 1;
}

let needsRender = true;
function draw() {
  if (!photosReady) {
    ctx.fillStyle = '#0b1020';
    ctx.fillRect(0, 0, W, H);
    return;
  }
  const b = photoBlend(cycleT);
  const set = photos[setIdx];
  drawCover(set[b.i], 1);
  if (b.fade > 0.001) drawCover(set[b.j], b.fade);

  const night = nightAmount(cycleT);

  /* snow that has settled on the trees, then the growing ground drift */
  if (frostCanvas && frostCount > 0) ctx.drawImage(frostCanvas, 0, 0);
  drawDrift();

  /* blowing-snow veil during gusts */
  if (gustEnv > 0.08 && softSprite) {
    const va = gustEnv * (0.10 + intensity * 0.12);
    for (let k = 0; k < 4; k++) {
      const vy = H * (0.72 + k * 0.06);
      const speed = (170 + k * 90) * gustDir;
      let vx = ((simT * speed) % (W + 460)) - 230;
      if (vx < -230) vx += W + 460;
      ctx.globalAlpha = va * (1 - k * 0.15);
      ctx.drawImage(softSprite, vx - 210, vy - 16, 420, 32);
      ctx.drawImage(softSprite, vx - 210 - (W + 460) * gustDir, vy - 16, 420, 32);
    }
    ctx.globalAlpha = 1;
  }

  drawFlakes(night);
}

/* ============================== simulation ============================== */

function step(dt) {
  simT += dt;
  if (autoCycle) {
    cycleT = (cycleT + dt * cycleSpeed / CYCLE_SECONDS) % 1;
    timeRange.value = cycleT.toFixed(3);
    updatePhaseLabel();
  }
  updateWind(dt);

  /* the darkness map follows the currently shown photo */
  const curPhase = photoBlend(cycleT).i;
  if (curPhase !== lumPhase) {
    lumPhase = curPhase;
    buildLumGrid();
  }

  const speedMul = 0.8 + intensity * 0.9;
  const stickScale = (0.16 + intensity * 0.45) * dt;
  for (let i = 0; i < activeFlakes; i++) {
    const L = fl[i], P = FLAYER[L];
    const sway = Math.sin(simT * P.freq + fp[i]) * fa[i];
    fy[i] += fv[i] * speedMul * dt;
    fx[i] += (sway + wind * (18 + fs[i] * 24)) * dt;
    if (fx[i] > W + 40) fx[i] -= W + 80;
    else if (fx[i] < -40) fx[i] += W + 80;

    /* landing on the growing ground drift — the flake merges into it */
    if (fy[i] > H + 2 - accumAt(fx[i]) - fs[i] * 0.4) {
      const idx = clamp((fx[i] / W * (HN - 1)) | 0, 0, HN - 1);
      if (accumPx[idx] < maxAccum) accumPx[idx] += 0.35 + fs[i] * 0.30 * (0.4 + intensity);
      spawnFlake(i, false);
      continue;
    }
    /* sticking to dark shapes — pines, log walls — mid-frame */
    if (fy[i] > H * 0.26 && fy[i] < H * 0.92 && frostCount < FROST_MAX && fy[i] > 0) {
      const dk = darknessAt(fx[i], fy[i]);
      if (dk > 0.45 && Math.random() < dk * dk * stickScale) {
        stampFrost(fx[i], fy[i], fs[i]);
        spawnFlake(i, false);
      }
    }
  }
  /* keep the drift soft and rounded */
  accumSmoothT += dt;
  if (accumSmoothT > 0.4) {
    accumSmoothT = 0;
    for (let i = 1; i < HN - 1; i++) {
      accumPx[i] = (accumPx[i - 1] + 2 * accumPx[i] + accumPx[i + 1]) * 0.25;
    }
  }

  const target = targetFlakeCount();
  if (activeFlakes !== target) setActiveFlakes(target);

  stepAudio();
  updateAudio();
}

/* ============================== main loop ============================== */

let renderedOnce = false, lastT = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000 || 0.016);
  lastT = now;
  if (reduceMotion) {
    updateAudio();
    if (!needsRender && renderedOnce) return;
    if (photosReady) needsRender = false;
    draw();
  } else {
    step(dt);
    draw();
  }
  if (!renderedOnce && photosReady) {
    renderedOnce = true;
    requestAnimationFrame(() => fadeEl.classList.add('gone'));
  }
}

/* ============================== controls ============================== */

const snowRange = document.getElementById('snowRange');
const snowLabel = document.getElementById('snowLabel');
const timeRange = document.getElementById('timeRange');
const phaseLabel = document.getElementById('phaseLabel');
const autoTime = document.getElementById('autoTime');
const windSeg = document.getElementById('windSeg');
const setSeg = document.getElementById('setSeg');
const audSeg = document.getElementById('audSeg');
const soundOn = document.getElementById('soundOn');
const volRange = document.getElementById('volRange');
const panel = document.getElementById('panel');
const handle = document.getElementById('handle');
const fadeEl = document.getElementById('fade');
const langSeg = document.getElementById('langSeg');
const speedRange = document.getElementById('speedRange');
const speedLabel = document.getElementById('speedLabel');
const closeBtn = document.getElementById('closeBtn');
const openBtn = document.getElementById('openBtn');

function updatePhaseLabel() {
  const b = photoBlend(cycleT);
  phaseLabel.textContent = T.phases[b.fade > 0.5 ? b.j : b.i];
}
function updateSnowLabel() {
  const i = intensity < 0.2 ? 0 : intensity < 0.6 ? 1 : intensity < 0.85 ? 2 : 3;
  snowLabel.textContent = T.snowLevels[i];
}
function applyLang(code) {
  if (!I18N[code]) return;
  lang = code;
  T = I18N[code];
  document.documentElement.lang = T._html;
  for (const el of document.querySelectorAll('[data-t]')) {
    const v = T[el.dataset.t];
    if (typeof v === 'string') el.textContent = v;
  }
  handle.setAttribute('aria-label', T._handle);
  for (const b of langSeg.querySelectorAll('button')) b.classList.toggle('on', b.dataset.l === code);
  updatePhaseLabel();
  updateSnowLabel();
  try { localStorage.setItem('wc-lang', code); } catch (e) { /* private mode */ }
}

langSeg.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn || btn.dataset.l === lang) return;
  applyLang(btn.dataset.l);
});

setSeg.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn || +btn.dataset.s === setIdx) return;
  for (const x of setSeg.querySelectorAll('button')) x.classList.toggle('on', x === btn);
  fadeEl.classList.add('switching');
  setTimeout(() => {
    setIdx = +btn.dataset.s;
    resetAccum();          // fresh landscape, fresh snow cover
    buildLumGrid();
    fadeEl.classList.remove('switching');
    needsRender = true;
  }, 300);
});
speedRange.addEventListener('input', () => {
  cycleSpeed = parseFloat(speedRange.value);
  speedLabel.textContent = cycleSpeed.toFixed(1) + '×';
});
closeBtn.addEventListener('click', () => {
  panel.classList.add('closed');
  openBtn.classList.add('show');
});
openBtn.addEventListener('click', () => {
  panel.classList.remove('closed');
  openBtn.classList.remove('show');
});
snowRange.addEventListener('input', () => {
  intensity = parseFloat(snowRange.value);
  updateSnowLabel();
  setActiveFlakes(targetFlakeCount());
  needsRender = true;
});
timeRange.addEventListener('input', () => {
  cycleT = parseFloat(timeRange.value);
  if (autoCycle) { autoCycle = false; autoTime.checked = false; }
  updatePhaseLabel();
  needsRender = true;
});
autoTime.addEventListener('change', () => {
  autoCycle = autoTime.checked && !reduceMotion;
  if (reduceMotion) autoTime.checked = false;
  needsRender = true;
});
windSeg.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  windMode = btn.dataset.w;
  for (const x of windSeg.querySelectorAll('button')) x.classList.toggle('on', x === btn);
});
soundOn.addEventListener('change', () => {
  audio.on = soundOn.checked;
  if (audio.on) initAudio();
  updateAudio();
});
volRange.addEventListener('input', () => {
  audio.vol = parseFloat(volRange.value);
  updateAudio();
});
audSeg.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  audio[btn.dataset.a] = !audio[btn.dataset.a];
  btn.classList.toggle('on', audio[btn.dataset.a]);
  updateAudio();
});
handle.addEventListener('click', () => panel.classList.toggle('open'));

/* ============================== boot ============================== */

if (reduceMotion) {
  autoCycle = false;
  autoTime.checked = false;
  cycleT = 0.75;                 // este: ablakfényes, nyugodt alapkép
  timeRange.value = '0.75';
}
let saved = null;
try { saved = localStorage.getItem('wc-lang'); } catch (e) { /* private mode */ }
if (saved === 'ge') saved = 'de';          // the button used to be labelled GE
if (!I18N[saved]) {
  const nav = (navigator.language || 'hu').slice(0, 2).toLowerCase();
  saved = I18N[nav] ? nav : 'hu';
}
applyLang(saved);

resize();
window.addEventListener('resize', resize);
requestAnimationFrame(frame);

})();
</script>
</body>
