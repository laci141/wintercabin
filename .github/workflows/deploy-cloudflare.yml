name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Fail early and legibly: without these the wrangler step dies with a
      # generic "non-interactive environment" message that hides the real cause.
      - name: Check Cloudflare credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=""
          [ -z "$TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$ACCOUNT" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under" \
                 "Settings → Secrets and variables → Actions. See README.md ▸ Deployment."
            exit 1
          fi
          echo "Both Cloudflare secrets are present."

      # The site is plain static files — no build step. Collect just what the
      # page needs so the repo's docs and CI config stay out of the deployment.
      - name: Assemble the site
        run: |
          mkdir -p public
          cp index.html procedural.html public/
          cp -r img public/
          cp _headers public/ 2>/dev/null || true
          ls -R public | head -40

      - name: Publish
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # pinned so the action skips its version probe and the extra install
          wranglerVersion: "3.90.0"
          command: pages deploy public --project-name=wintercabin --branch=main
